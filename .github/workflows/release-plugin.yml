name: Release Plugin

on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      plugin_dir:
        description: Plugin directory under plugins/ (e.g. moderation)
        required: true
        type: string
      version:
        description: Semantic version without v prefix (e.g. 0.1.0)
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Build ZIP & Publish Plugin Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve plugin metadata and build archive
        id: pack
        env:
          WS_PLUGIN_SIGNING_KEY: ${{ secrets.WS_PLUGIN_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            PLUGIN_DIR="${TAG%-v*}"
            VERSION="${TAG##*-v}"
          else
            PLUGIN_DIR="${{ github.event.inputs.plugin_dir }}"
            VERSION="${{ github.event.inputs.version }}"
            TAG="${PLUGIN_DIR}-v${VERSION}"
          fi
          MANIFEST="plugins/${PLUGIN_DIR}/manifest.json"
          test -f "${MANIFEST}"
          MANIFEST_ID="$(jq -r '.manifest.id' "${MANIFEST}")"
          MANIFEST_VER="$(jq -r '.manifest.version' "${MANIFEST}")"
          if [ "${MANIFEST_VER}" != "${VERSION}" ]; then
            echo "manifest.json version (${MANIFEST_VER}) does not match tag version (${VERSION})" >&2
            exit 1
          fi
          SIGN_ARGS=()
          if [[ "${MANIFEST_ID}" == wishingskin.* ]]; then
            if [ -z "${WS_PLUGIN_SIGNING_KEY:-}" ]; then
              echo "WS_PLUGIN_SIGNING_KEY secret is required to sign official plugin ${MANIFEST_ID}" >&2
              exit 1
            fi
            SIGN_ARGS=(-require-sign)
          fi
          OUT="$(go run ./tools/pack pack -dir "plugins/${PLUGIN_DIR}" -out dist "${SIGN_ARGS[@]+"${SIGN_ARGS[@]}"}")"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "id=$(echo "${OUT}" | jq -r '.id')" >> "${GITHUB_OUTPUT}"
          echo "name=$(echo "${OUT}" | jq -r '.name')" >> "${GITHUB_OUTPUT}"
          echo "version=$(echo "${OUT}" | jq -r '.version')" >> "${GITHUB_OUTPUT}"
          echo "file=$(echo "${OUT}" | jq -r '.file')" >> "${GITHUB_OUTPUT}"
          echo "sha256=$(echo "${OUT}" | jq -r '.sha256')" >> "${GITHUB_OUTPUT}"
          (cd dist && sha256sum "$(basename "$(echo "${OUT}" | jq -r '.file')")" > SHA256SUMS.txt)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.pack.outputs.file }}
            dist/SHA256SUMS.txt
      - name: Update catalog/catalog.json on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILENAME="$(basename "${{ steps.pack.outputs.file }}")"
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.pack.outputs.tag }}/${FILENAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          go run ./tools/pack catalog \
            -file catalog/catalog.json \
            -id "${{ steps.pack.outputs.id }}" \
            -name "${{ steps.pack.outputs.name }}" \
            -version "${{ steps.pack.outputs.version }}" \
            -url "${URL}" \
            -sha256 "${{ steps.pack.outputs.sha256 }}"
          git add catalog/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(catalog): publish ${{ steps.pack.outputs.id }} ${{ steps.pack.outputs.version }}"
            git push origin main
            gh workflow run pages.yml --repo "${{ github.repository }}" --ref main || true
          fi

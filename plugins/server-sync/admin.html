<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>社群与游戏服务器联动管理</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: transparent;
    --panel: #ffffff;
    --subtle: #f4f4f6;
    --ink: #18181b;
    --muted: #52525b;
    --border: #e4e4e7;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: rgba(37, 99, 235, 0.12);
    --btn-text: #ffffff;
    --ok: #15803d;
    --ok-bg: rgba(22, 163, 74, 0.12);
    --danger: #b91c1c;
    --danger-bg: rgba(185, 28, 28, 0.12);
    --radius: 12px;
    --radius-ctl: 9px;
    --shadow: none;
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-display: var(--font-sans);
  }
  :root[data-theme="dark"] {
    --panel: #18181b;
    --subtle: #202024;
    --ink: #f4f4f5;
    --muted: #a1a1aa;
    --border: #2e2e34;
    --accent: #60a5fa;
    --accent-hover: #3b82f6;
    --ok: #4ade80;
    --ok-bg: rgba(74, 222, 128, 0.14);
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.14);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; padding: 4px; background: transparent; color: var(--ink); font: 14px/1.55 var(--font-sans); }
  .stack { display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; font-family: var(--font-display); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--subtle); border: 1px solid var(--border); border-radius: var(--radius-ctl); padding: 10px 12px; }
  .stat span { display: block; font-size: 12px; color: var(--muted); }
  .stat strong { font-size: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; min-height: 36px; border-radius: var(--radius-ctl); border: 1px solid var(--border); background: var(--panel); color: var(--ink); padding: 6px 12px; cursor: pointer; font-weight: 500; transition: background-color 140ms ease, border-color 140ms ease; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--btn-text); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  pre { margin: 0; padding: 12px; border-radius: var(--radius-ctl); background: var(--subtle); border: 1px solid var(--border); overflow: auto; font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
  .pill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.err { background: var(--danger-bg); color: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .muted { color: var(--muted); font-size: 13px; margin: 0; }
</style>
</head>
<body>
<div class="stack">
  <section class="card">
    <div class="row" style="justify-content:space-between">
      <h2>联动状态与事件投递</h2>
      <div class="row">
        <button id="refresh-btn" type="button">刷新</button>
        <button id="test-btn" class="primary" type="button">发送测试通知</button>
      </div>
    </div>
    <div id="stats" class="grid"></div>
    <p id="test-msg" class="muted"></p>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <h2>游戏服务端反查接口示例</h2>
      <button id="copy-curl" type="button">复制示例命令</button>
    </div>
    <p class="muted">将站点根地址替换为你的实际域名，并在插件设置中配置好 <code>server_api_key</code> 密钥（注意不要把密钥提交到公开仓库）：</p>
    <pre id="curl-sample"></pre>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <h2>近期推送记录（最多保留 50 条）</h2>
      <button id="clear-btn" type="button">清空记录</button>
    </div>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>时间</th><th>事件</th><th>目标</th><th>状态</th><th>结果说明</th></tr></thead>
        <tbody id="logs-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
(() => {
  const reqMap = new Map();
  const hostMap = new Map();
  let seq = 0;

  function postResize() {
    window.parent.postMessage({
      type: 'wishingskin:resize',
      height: Math.max(260, Math.ceil(document.documentElement.scrollHeight))
    }, '*');
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(postResize).observe(document.documentElement);
  }
  window.addEventListener('load', postResize);

  function applyHostContext(ctx) {
    if (!ctx || typeof ctx !== 'object') return;
    document.documentElement.dataset.theme = ctx.theme === 'dark' ? 'dark' : 'light';
    if (ctx.tokens && typeof ctx.tokens === 'object') {
      const s = document.documentElement.style;
      const map = {
        panel: '--panel', subtle: '--subtle', ink: '--ink', muted: '--muted', border: '--border',
        accent: '--accent', accentHover: '--accent-hover', accentSoft: '--accent-soft',
        buttonText: '--btn-text', error: '--danger', errorBg: '--danger-bg',
        radiusCard: '--radius', radiusControl: '--radius-ctl', shadowCard: '--shadow',
        fontSans: '--font-sans', fontDisplay: '--font-display'
      };
      for (const [k, cssVar] of Object.entries(map)) {
        if (typeof ctx.tokens[k] === 'string' && ctx.tokens[k]) s.setProperty(cssVar, ctx.tokens[k]);
      }
    }
    if (typeof ctx.fontFaceCss === 'string') {
      let el = document.getElementById('ws-host-fonts');
      if (!el) { el = document.createElement('style'); el.id = 'ws-host-fonts'; document.head.appendChild(el); }
      el.textContent = ctx.fontFaceCss;
    }
    if (typeof ctx.siteOrigin === 'string' && ctx.siteOrigin && ctx.siteOrigin !== 'null') {
      updateCurlSample(ctx.siteOrigin);
    }
    requestAnimationFrame(postResize);
  }

  window.addEventListener('message', (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'wishingskin:context' && msg.context) { applyHostContext(msg.context); return; }
    if (msg.type === 'wishingskin:settings-updated') { void refresh(); return; }
    if (msg.type === 'wishingskin:response' && reqMap.has(msg.id)) {
      const h = reqMap.get(msg.id); reqMap.delete(msg.id); clearTimeout(h.t);
      h.resolve({ status: msg.status, body: msg.body });
      return;
    }
    if (msg.type === 'wishingskin:host-response' && hostMap.has(msg.id)) {
      const h = hostMap.get(msg.id); hostMap.delete(msg.id); clearTimeout(h.t);
      if (msg.ok) h.resolve(msg.data);
      else h.reject(new Error(msg.error || '操作失败'));
    }
  });

  function callPlugin(method, path, body) {
    const id = 'sync-' + (++seq);
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { reqMap.delete(id); reject(new Error('请求超时')); }, 10000);
      reqMap.set(id, { resolve, reject, t });
      window.parent.postMessage({ type: 'wishingskin:request', id, method, path, body }, '*');
    });
  }

  function callHost(action, payload) {
    const id = 'synch-' + (++seq);
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { hostMap.delete(id); reject(new Error('宿主响应超时')); }, 10000);
      hostMap.set(id, { resolve, reject, t });
      window.parent.postMessage({ type: 'wishingskin:host', id, action, payload }, '*');
    });
  }

  function makeStat(label, val) {
    const d = document.createElement('div'); d.className = 'stat';
    const s = document.createElement('span'); s.textContent = label;
    const b = document.createElement('strong'); b.textContent = String(val);
    d.append(s, b);
    return d;
  }

  let curlText = '';
  function updateCurlSample(siteOrigin) {
    const cleanOrigin = (siteOrigin && siteOrigin !== 'null') ? String(siteOrigin).replace(/\/+$/, '') : 'https://你的皮肤站域名';
    curlText = 'curl -X POST "' + cleanOrigin + '/api/plugins/wishingskin.server-sync/query" \\\n  -H "Content-Type: application/json" \\\n  -d \'{"apiKey":"在此填写server_api_key","name":"Steve"}\'';
    document.getElementById('curl-sample').textContent = curlText;
  }
  updateCurlSample('');

  document.getElementById('copy-curl').addEventListener('click', async () => {
    try {
      await callHost('copyText', { text: curlText });
      callHost('notify', { message: '示例命令已复制到剪贴板', kind: 'success' }).catch(() => {});
    } catch {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(curlText).catch(() => {});
      }
    }
  });

  async function refresh() {
    const res = await callPlugin('GET', '/status');
    if (res.status !== 200) return;
    const d = res.body;

    const statsEl = document.getElementById('stats');
    statsEl.innerHTML = '';
    statsEl.append(
      makeStat('推送模式', String(d.targetType || 'generic').toUpperCase()),
      makeStat('Webhook 状态', d.webhookConfigured ? '已配置' : '未配置'),
      makeStat('反查密钥', d.queryConfigured ? '已启用' : '未启用'),
      makeStat('成功投递', (d.stats && d.stats.sent) || 0),
      makeStat('失败次数', (d.stats && d.stats.failed) || 0)
    );

    const tbody = document.getElementById('logs-body');
    tbody.innerHTML = '';
    const logs = d.logs || [];
    if (logs.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 5; td.className = 'muted'; td.textContent = '暂无推送记录';
      tr.appendChild(td); tbody.appendChild(tr);
    } else {
      for (const row of logs) {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td'); td1.textContent = row.ts ? new Date(row.ts * 1000).toLocaleString() : '';
        const td2 = document.createElement('td'); td2.textContent = row.event || '';
        const td3 = document.createElement('td'); td3.textContent = row.target || '';
        const td4 = document.createElement('td');
        const pill = document.createElement('span');
        pill.className = 'pill ' + (row.ok ? 'ok' : 'err');
        pill.textContent = row.ok ? '成功' : '失败';
        td4.appendChild(pill);
        const td5 = document.createElement('td'); td5.textContent = row.message || '';
        tr.append(td1, td2, td3, td4, td5);
        tbody.appendChild(tr);
      }
    }
    requestAnimationFrame(postResize);
  }

  document.getElementById('refresh-btn').addEventListener('click', () => void refresh());
  document.getElementById('test-btn').addEventListener('click', async () => {
    const msgEl = document.getElementById('test-msg');
    msgEl.textContent = '正在发送测试推送…';
    const res = await callPlugin('POST', '/test-notify', {});
    if (res.status !== 200) {
      msgEl.textContent = (res.body && res.body.error) || '推送失败';
    } else {
      msgEl.textContent = (res.body.ok ? '测试推送成功' : '测试推送失败') + (res.body.message ? '（' + res.body.message + '）' : '');
    }
    await refresh();
  });
  document.getElementById('clear-btn').addEventListener('click', async () => {
    await callPlugin('POST', '/clear-logs');
    await refresh();
  });

  void refresh();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>玩家名片与渲染图</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --panel: #ffffff;
    --subtle: #f4f4f6;
    --ink: #18181b;
    --muted: #52525b;
    --border: #e4e4e7;
    --accent: #2563eb;
    --radius: 10px;
  }
  :root[data-theme="dark"] {
    --bg: #111113;
    --panel: #18181b;
    --subtle: #202024;
    --ink: #f4f4f5;
    --muted: #a1a1aa;
    --border: #2e2e34;
    --accent: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 14px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .layout { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 780px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .field { display: grid; gap: 6px; }
  label { font-size: 12px; color: var(--muted); font-weight: 600; }
  select, input, button {
    font: inherit; min-height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--ink); padding: 6px 10px;
  }
  button { cursor: pointer; font-weight: 500; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .preview-stage { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; padding: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--subtle); }
  .preview-stage img { image-rendering: pixelated; }
  .preview-avatar { width: 96px; height: 96px; border-radius: 10px; }
  .preview-body { width: 96px; height: 192px; }
  .preview-card { max-width: 100%; height: auto; }
  .snippet { display: grid; gap: 6px; }
  .snippet-row { display: flex; gap: 8px; }
  .snippet-row input { flex: 1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
  .status { font-size: 12px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="layout">
  <div class="card">
    <h2>名片与渲染选项</h2>
    <div class="field">
      <label for="char-select">选择角色</label>
      <select id="char-select"></select>
    </div>
    <div class="field">
      <label for="card-theme">SVG 名片配色</label>
      <select id="card-theme">
        <option value="light">浅色经典 (Light)</option>
        <option value="dark">深色夜间 (Dark)</option>
        <option value="emerald">祖母绿 (Emerald)</option>
      </select>
    </div>
    <div class="field">
      <label for="avatar-size">头像边长 (px)</label>
      <select id="avatar-size">
        <option value="64">64×64</option>
        <option value="128" selected>128×128</option>
        <option value="256">256×256</option>
      </select>
    </div>
    <div class="field">
      <label for="body-side">立绘朝向</label>
      <select id="body-side">
        <option value="front">正面视角</option>
        <option value="back">背面视角</option>
      </select>
    </div>
    <label class="check"><input id="opt-outer" type="checkbox" checked /> 渲染第二外层饰品与帽子</label>
    <p id="empty-note" class="status" hidden>尚未创建角色，请先前往角色管理创建角色。</p>
  </div>

  <div class="card">
    <h2>实时预览与嵌入链接</h2>
    <div class="preview-stage">
      <img id="img-avatar" class="preview-avatar" alt="头像预览" />
      <img id="img-body" class="preview-body" alt="全身渲染" />
      <img id="img-card" class="preview-card" alt="SVG 名片预览" />
    </div>

    <div class="snippet">
      <label>SVG 玩家名片直链</label>
      <div class="snippet-row"><input id="url-card" type="text" readonly /><button type="button" data-copy="url-card">复制</button></div>
    </div>
    <div class="snippet">
      <label>Markdown 嵌入代码 (GitHub README)</label>
      <div class="snippet-row"><input id="url-md" type="text" readonly /><button type="button" data-copy="url-md">复制</button></div>
    </div>
    <div class="snippet">
      <label>BBCode 嵌入代码 (Minecraft 论坛)</label>
      <div class="snippet-row"><input id="url-bb" type="text" readonly /><button type="button" data-copy="url-bb">复制</button></div>
    </div>
    <div class="snippet">
      <label>正方形头像 PNG 直链</label>
      <div class="snippet-row"><input id="url-avatar" type="text" readonly /><button type="button" data-copy="url-avatar">复制</button></div>
    </div>
    <div class="snippet">
      <label>全身纸片立绘 PNG 直链</label>
      <div class="snippet-row"><input id="url-body" type="text" readonly /><button type="button" data-copy="url-body">复制</button></div>
    </div>
  </div>
</div>

<script>
(() => {
  const reqMap = new Map();
  const hostMap = new Map();
  let seq = 0;
  let publicBase = '';

  window.addEventListener('message', (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'wishingskin:context' && msg.context) {
      document.documentElement.dataset.theme = msg.context.theme === 'dark' ? 'dark' : 'light';
      return;
    }
    if (msg.type === 'wishingskin:response' && reqMap.has(msg.id)) {
      const h = reqMap.get(msg.id); reqMap.delete(msg.id); clearTimeout(h.t);
      h.resolve({ status: msg.status, body: msg.body });
    }
    if (msg.type === 'wishingskin:host-response' && hostMap.has(msg.id)) {
      const h = hostMap.get(msg.id); hostMap.delete(msg.id); clearTimeout(h.t);
      h.resolve(msg);
    }
  });

  function callPlugin(method, path, query) {
    const id = 'rc-' + (++seq);
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { reqMap.delete(id); reject(new Error('请求超时')); }, 15000);
      reqMap.set(id, { resolve, reject, t });
      window.parent.postMessage({ type: 'wishingskin:request', id, method, path, query }, '*');
    });
  }

  function callHost(action, payload) {
    const id = 'rch-' + (++seq);
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { hostMap.delete(id); reject(new Error('宿主响应超时')); }, 15000);
      hostMap.set(id, { resolve, reject, t });
      window.parent.postMessage({ type: 'wishingskin:host', id, action, payload }, '*');
    });
  }

  async function refreshPreviews() {
    const name = document.getElementById('char-select').value;
    if (!name) return;
    const theme = document.getElementById('card-theme').value;
    const size = document.getElementById('avatar-size').value;
    const side = document.getElementById('body-side').value;
    const outer = document.getElementById('opt-outer').checked ? '1' : '0';

    const avQ = 'name=' + encodeURIComponent(name) + '&size=' + size + '&hat=' + outer;
    const bdQ = 'name=' + encodeURIComponent(name) + '&scale=6&side=' + side + '&outer=' + outer;
    const cdQ = 'name=' + encodeURIComponent(name) + '&theme=' + theme;

    const prefix = (publicBase || '') + '/api/plugins/wishingskin.render-card';
    const cardUrl = prefix + '/card?' + cdQ;
    document.getElementById('url-card').value = cardUrl;
    document.getElementById('url-md').value = '![' + name + '](' + cardUrl + ')';
    document.getElementById('url-bb').value = '[img]' + prefix + '/body?' + bdQ + '[/img]';
    document.getElementById('url-avatar').value = prefix + '/avatar?' + avQ;
    document.getElementById('url-body').value = prefix + '/body?' + bdQ;

    const [av, bd, cd] = await Promise.all([
      callPlugin('GET', '/avatar', avQ),
      callPlugin('GET', '/body', bdQ),
      callPlugin('GET', '/card', cdQ)
    ]);
    if (av.status === 200 && av.body.bodyBase64) document.getElementById('img-avatar').src = 'data:' + av.body.contentType + ';base64,' + av.body.bodyBase64;
    if (bd.status === 200 && bd.body.bodyBase64) document.getElementById('img-body').src = 'data:' + bd.body.contentType + ';base64,' + bd.body.bodyBase64;
    if (cd.status === 200 && cd.body.bodyBase64) document.getElementById('img-card').src = 'data:' + cd.body.contentType + ';base64,' + cd.body.bodyBase64;
  }

  async function init() {
    const [infoRes, charRes] = await Promise.all([
      callPlugin('GET', '/info', ''),
      callHost('listCharacters', {})
    ]);
    if (infoRes.status === 200) {
      publicBase = infoRes.body.publicUrl || '';
      if (infoRes.body.defaultTheme) document.getElementById('card-theme').value = infoRes.body.defaultTheme;
    }
    const cSel = document.getElementById('char-select');
    const chars = (charRes.ok && charRes.data && charRes.data.characters) ? charRes.data.characters : [];
    document.getElementById('empty-note').hidden = chars.length > 0;
    for (const c of chars) {
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.name;
      cSel.appendChild(opt);
    }
    if (chars.length) void refreshPreviews();
  }

  for (const id of ['char-select', 'card-theme', 'avatar-size', 'body-side', 'opt-outer']) {
    document.getElementById(id).addEventListener('change', () => void refreshPreviews());
  }

  for (const btn of document.querySelectorAll('[data-copy]')) {
    btn.addEventListener('click', async () => {
      const input = document.getElementById(btn.dataset.copy);
      if (!input || !input.value) return;
      try {
        await navigator.clipboard.writeText(input.value);
        void callHost('notify', { message: '已复制到剪贴板。', kind: 'success' });
      } catch {
        input.select();
        void callHost('notify', { message: '已选中链接，请按 Ctrl+C 复制。', kind: 'success' });
      }
    });
  }

  void init();
})();
</script>
</body>
</html>

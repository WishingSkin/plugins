<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>玩家名片与角色渲染</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: transparent;
    --panel: #ffffff;
    --subtle: #f4f4f6;
    --ink: #18181b;
    --muted: #52525b;
    --border: #e4e4e7;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: rgba(37, 99, 235, 0.12);
    --btn-text: #ffffff;
    --radius: 12px;
    --radius-ctl: 9px;
    --shadow: none;
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-display: var(--font-sans);
  }
  :root[data-theme="dark"] {
    --panel: #18181b;
    --subtle: #202024;
    --ink: #f4f4f5;
    --muted: #a1a1aa;
    --border: #2e2e34;
    --accent: #60a5fa;
    --accent-hover: #3b82f6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; padding: 4px; background: transparent; color: var(--ink); font: 14px/1.55 var(--font-sans); }
  .layout { display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; }
  h2 { margin: 0; font-size: 16px; font-weight: 600; font-family: var(--font-display); }
  .sub { margin: 0; font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 600; }
  select, input, button { font: inherit; min-height: 36px; border-radius: var(--radius-ctl); border: 1px solid var(--border); background: var(--panel); color: var(--ink); padding: 6px 10px; }
  button { cursor: pointer; font-weight: 500; transition: background-color 140ms ease, border-color 140ms ease; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--btn-text); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .preview-stage { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 16px; border-radius: var(--radius-ctl); background: var(--subtle); border: 1px solid var(--border); }
  .preview-box { display: grid; gap: 6px; justify-items: center; }
  .preview-box span { font-size: 12px; color: var(--muted); }
  img.pixel { image-rendering: pixelated; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); }
  img.card-img { max-width: 100%; height: auto; border-radius: 14px; }
  .snip { display: grid; gap: 6px; padding: 10px 12px; border-radius: var(--radius-ctl); background: var(--subtle); border: 1px solid var(--border); }
  .snip-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .snip-head strong { font-size: 13px; }
  code { font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; word-break: break-all; color: var(--ink); }
</style>
</head>
<body>
<div class="layout">
  <section class="card">
    <div>
      <h2>角色渲染与玩家名片生成器</h2>
      <p class="sub">选择你的角色即可生成公开头像、全身 2D 立绘以及可直接嵌入论坛与 GitHub README 的矢量 SVG 名片链接。</p>
    </div>

    <div class="grid">
      <label>选择角色
        <select id="char-select"></select>
      </label>
      <label>名片配色主题
        <select id="card-theme">
          <option value="light">浅色 (Light)</option>
          <option value="dark">深色 (Dark)</option>
          <option value="emerald">翠绿 (Emerald)</option>
        </select>
      </label>
      <label>头像尺寸
        <select id="av-size">
          <option value="64">64×64</option>
          <option value="128" selected>128×128</option>
          <option value="256">256×256</option>
        </select>
      </label>
      <label>立绘朝向
        <select id="body-side">
          <option value="front">正面</option>
          <option value="back">背面</option>
        </select>
      </label>
    </div>

    <div id="stage" class="preview-stage" hidden>
      <div class="preview-box">
        <img id="img-avatar" class="pixel" width="96" height="96" alt="角色头像" />
        <span>角色头像</span>
      </div>
      <div class="preview-box">
        <img id="img-body" class="pixel" width="80" height="160" alt="全身立绘" />
        <span>全身立绘</span>
      </div>
      <div class="preview-box" style="flex:1;min-width:260px">
        <img id="img-card" class="card-img" alt="玩家名片 SVG" />
        <span>SVG 玩家名片</span>
      </div>
    </div>
    <p id="empty-msg" class="sub" hidden></p>
  </section>

  <section id="links-card" class="card" hidden>
    <h2>快捷链接与嵌入代码</h2>
    <div class="snip">
      <div class="snip-head"><strong>SVG 玩家名片链接</strong><button type="button" data-copy="card-url">复制链接</button></div>
      <code id="card-url"></code>
    </div>
    <div class="snip">
      <div class="snip-head"><strong>Markdown / GitHub README 嵌入代码</strong><button type="button" data-copy="md-code">复制 Markdown</button></div>
      <code id="md-code"></code>
    </div>
    <div class="snip">
      <div class="snip-head"><strong>论坛 BBCode 嵌入代码</strong><button type="button" data-copy="bb-code">复制 BBCode</button></div>
      <code id="bb-code"></code>
    </div>
    <div class="snip">
      <div class="snip-head"><strong>角色头像直链</strong><button type="button" data-copy="avatar-url">复制链接</button></div>
      <code id="avatar-url"></code>
    </div>
    <div class="snip">
      <div class="snip-head"><strong>全身立绘直链</strong><button type="button" data-copy="body-url">复制链接</button></div>
      <code id="body-url"></code>
    </div>
  </section>
</div>

<script>
(() => {
  const reqMap = new Map();
  const hostMap = new Map();
  let seq = 0;
  let publicUrlFromServer = '';
  let siteOrigin = '';
  let renderSeq = 0;

  function effectiveOrigin() {
    return publicUrlFromServer || siteOrigin || 'https://你的皮肤站域名';
  }

  function postResize() {
    window.parent.postMessage({
      type: 'wishingskin:resize',
      height: Math.max(280, Math.ceil(document.documentElement.scrollHeight))
    }, '*');
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(postResize).observe(document.documentElement);
  }
  window.addEventListener('load', postResize);

  function applyHostContext(ctx) {
    if (!ctx || typeof ctx !== 'object') return;
    document.documentElement.dataset.theme = ctx.theme === 'dark' ? 'dark' : 'light';
    if (ctx.tokens && typeof ctx.tokens === 'object') {
      const s = document.documentElement.style;
      const map = {
        panel: '--panel', subtle: '--subtle', ink: '--ink', muted: '--muted', border: '--border',
        accent: '--accent', accentHover: '--accent-hover', accentSoft: '--accent-soft',
        buttonText: '--btn-text', radiusCard: '--radius', radiusControl: '--radius-ctl', shadowCard: '--shadow',
        fontSans: '--font-sans', fontDisplay: '--font-display'
      };
      for (const [k, cssVar] of Object.entries(map)) {
        if (typeof ctx.tokens[k] === 'string' && ctx.tokens[k]) s.setProperty(cssVar, ctx.tokens[k]);
      }
    }
    if (typeof ctx.fontFaceCss === 'string') {
      let el = document.getElementById('ws-host-fonts');
      if (!el) { el = document.createElement('style'); el.id = 'ws-host-fonts'; document.head.appendChild(el); }
      el.textContent = ctx.fontFaceCss;
    }
    if (typeof ctx.siteOrigin === 'string' && ctx.siteOrigin && ctx.siteOrigin !== 'null') {
      siteOrigin = ctx.siteOrigin.replace(/\/+$/, '');
      if (document.getElementById('char-select').value) {
        updateUrls();
      }
    }
    requestAnimationFrame(postResize);
  }

  window.addEventListener('message', (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'wishingskin:context' && msg.context) { applyHostContext(msg.context); return; }
    if (msg.type === 'wishingskin:response' && reqMap.has(msg.id)) {
      const h = reqMap.get(msg.id); reqMap.delete(msg.id); clearTimeout(h.t);
      h.resolve({ status: msg.status, body: msg.body });
      return;
    }
    if (msg.type === 'wishingskin:host-response' && hostMap.has(msg.id)) {
      const h = hostMap.get(msg.id); hostMap.delete(msg.id); clearTimeout(h.t);
      if (msg.ok) h.resolve(msg.data);
      else h.reject(new Error(msg.error || '操作失败'));
    }
  });

  function callPlugin(method, path, body, query) {
    const id = 'rc-' + (++seq);
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { reqMap.delete(id); reject(new Error('请求超时')); }, 15000);
      reqMap.set(id, { resolve, reject, t });
      window.parent.postMessage({ type: 'wishingskin:request', id, method, path, query, body }, '*');
    });
  }

  function callHost(action, payload) {
    const id = 'rch-' + (++seq);
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { hostMap.delete(id); reject(new Error('宿主响应超时')); }, 15000);
      hostMap.set(id, { resolve, reject, t });
      window.parent.postMessage({ type: 'wishingskin:host', id, action, payload }, '*');
    });
  }

  function toDataUri(res, fallbackMime) {
    if (!res || res.status !== 200 || !res.body) return '';
    if (typeof res.body === 'string') {
      const mime = fallbackMime || 'image/svg+xml';
      if (mime.includes('svg')) {
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(res.body);
      }
      return '';
    }
    if (res.body.bodyBase64) {
      const mime = res.body.contentType || fallbackMime || 'image/png';
      return 'data:' + mime + ';base64,' + res.body.bodyBase64;
    }
    return '';
  }

  function updateUrls() {
    const name = document.getElementById('char-select').value;
    if (!name) return null;
    const theme = document.getElementById('card-theme').value;
    const size = document.getElementById('av-size').value;
    const side = document.getElementById('body-side').value;

    const qName = encodeURIComponent(name);
    const avQuery = 'name=' + qName + '&size=' + encodeURIComponent(size);
    const bdQuery = 'name=' + qName + '&side=' + encodeURIComponent(side) + '&scale=6';
    const cdQuery = 'name=' + qName + '&theme=' + encodeURIComponent(theme);

    const base = effectiveOrigin();
    const fullAv = base + '/api/plugins/wishingskin.render-card/avatar?' + avQuery;
    const fullBd = base + '/api/plugins/wishingskin.render-card/body?' + bdQuery;
    const fullCard = base + '/api/plugins/wishingskin.render-card/card?' + cdQuery;

    document.getElementById('card-url').textContent = fullCard;
    document.getElementById('avatar-url').textContent = fullAv;
    document.getElementById('body-url').textContent = fullBd;
    document.getElementById('md-code').textContent = '![' + name + ' WishingSkin](' + fullCard + ')';
    document.getElementById('bb-code').textContent = '[img]' + fullCard + '[/img]';
    return { avQuery, bdQuery, cdQuery };
  }

  async function renderSelected() {
    const queries = updateUrls();
    const stage = document.getElementById('stage');
    const linksCard = document.getElementById('links-card');
    if (!queries) {
      stage.hidden = true;
      linksCard.hidden = true;
      requestAnimationFrame(postResize);
      return;
    }
    stage.hidden = false;
    linksCard.hidden = false;
    requestAnimationFrame(postResize);

    const mySeq = ++renderSeq;
    const [avRes, bdRes, cdRes] = await Promise.all([
      callPlugin('GET', '/avatar', undefined, queries.avQuery).catch(() => null),
      callPlugin('GET', '/body', undefined, queries.bdQuery).catch(() => null),
      callPlugin('GET', '/card', undefined, queries.cdQuery).catch(() => null)
    ]);
    if (mySeq !== renderSeq) return;

    const avSrc = toDataUri(avRes, 'image/png');
    const bdSrc = toDataUri(bdRes, 'image/png');
    const cdSrc = toDataUri(cdRes, 'image/svg+xml');
    if (avSrc) document.getElementById('img-avatar').src = avSrc;
    else document.getElementById('img-avatar').removeAttribute('src');
    if (bdSrc) document.getElementById('img-body').src = bdSrc;
    else document.getElementById('img-body').removeAttribute('src');
    if (cdSrc) document.getElementById('img-card').src = cdSrc;
    else document.getElementById('img-card').removeAttribute('src');
    requestAnimationFrame(postResize);
  }

  async function init() {
    const [infoRes, charRes] = await Promise.allSettled([
      callPlugin('GET', '/info'),
      callHost('listCharacters')
    ]);
    if (infoRes.status === 'fulfilled' && infoRes.value && infoRes.value.status === 200 && infoRes.value.body) {
      const b = infoRes.value.body;
      if (b.publicUrl) publicUrlFromServer = String(b.publicUrl).replace(/\/+$/, '');
      if (b.defaultTheme) document.getElementById('card-theme').value = b.defaultTheme;
    }

    const sel = document.getElementById('char-select');
    sel.innerHTML = '';
    const em = document.getElementById('empty-msg');
    if (charRes.status !== 'fulfilled') {
      em.hidden = false;
      em.textContent = '读取角色列表失败，请刷新页面或重新登录后重试。';
      requestAnimationFrame(postResize);
      return;
    }
    const chars = (charRes.value && charRes.value.characters) || [];
    if (chars.length === 0) {
      em.hidden = false;
      em.textContent = '你还没有创建角色，请先前往“角色管理”创建角色后再生成名片。';
      requestAnimationFrame(postResize);
      return;
    }
    em.hidden = true;
    for (const c of chars) {
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.name + (c.model === 'slim' ? '（Alex）' : '（Steve）');
      sel.appendChild(opt);
    }
    void renderSelected();
  }

  for (const id of ['char-select', 'card-theme', 'av-size', 'body-side']) {
    document.getElementById(id).addEventListener('change', () => void renderSelected());
  }

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-copy]');
    if (!btn) return;
    const codeEl = document.getElementById(btn.dataset.copy);
    if (!codeEl) return;
    const text = codeEl.textContent || '';
    try {
      await callHost('copyText', { text });
    } catch {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text).catch(() => {});
      }
    }
  });

  void init();
})();
</script>
</body>
</html>

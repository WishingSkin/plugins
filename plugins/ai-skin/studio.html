<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI 皮肤工坊</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: transparent;
    --panel: #ffffff;
    --subtle: #f4f4f6;
    --ink: #18181b;
    --muted: #52525b;
    --border: #e4e4e7;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: rgba(37, 99, 235, 0.12);
    --btn-text: #ffffff;
    --ok: #15803d;
    --ok-bg: rgba(22, 163, 74, 0.12);
    --danger: #b91c1c;
    --danger-bg: rgba(185, 28, 28, 0.12);
    --radius: 12px;
    --radius-ctl: 9px;
    --shadow: none;
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-display: var(--font-sans);
  }
  :root[data-theme="dark"] {
    --panel: #18181b;
    --subtle: #202024;
    --ink: #f4f4f5;
    --muted: #a1a1aa;
    --border: #2e2e34;
    --accent: #60a5fa;
    --accent-hover: #3b82f6;
    --ok: #4ade80;
    --ok-bg: rgba(74, 222, 128, 0.14);
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.14);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; padding: 4px; background: transparent; color: var(--ink); font: 14px/1.55 var(--font-sans); }
  .layout { display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; }
  h2 { margin: 0; font-size: 16px; font-weight: 600; font-family: var(--font-display); }
  .sub { margin: 0; font-size: 13px; color: var(--muted); }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 600; }
  textarea, input, select, button { font: inherit; border-radius: var(--radius-ctl); border: 1px solid var(--border); background: var(--panel); color: var(--ink); padding: 8px 10px; }
  textarea { min-height: 82px; resize: vertical; line-height: 1.5; }
  input, select, button { min-height: 36px; }
  button { cursor: pointer; font-weight: 500; transition: background-color 140ms ease, border-color 140ms ease; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--btn-text); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 4px 10px; min-height: 28px; font-size: 12px; border-radius: 999px; background: var(--subtle); border: 1px solid var(--border); }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .meta-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; background: var(--subtle); border: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .badge.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
  .progress { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-ctl); background: var(--subtle); border: 1px solid var(--border); }
  .px-loader { display: grid; grid-template-columns: repeat(2, 7px); gap: 2px; flex-shrink: 0; }
  .px-loader i { display: block; width: 7px; height: 7px; border-radius: 1px; background: var(--accent); animation: px-step 1s steps(4, end) infinite; }
  .px-loader i:nth-child(2) { animation-delay: -0.75s; }
  .px-loader i:nth-child(4) { animation-delay: -0.5s; }
  .px-loader i:nth-child(3) { animation-delay: -0.25s; }
  @keyframes px-step { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .px-loader i { animation: none; opacity: 0.8; } }
  .progress-body { flex: 1; min-width: 180px; display: grid; gap: 6px; }
  .progress-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .elapsed { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .step-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .step-pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); }
  .step-pill.active { border-color: var(--accent); color: var(--accent); font-weight: 600; background: var(--accent-soft); }
  .step-pill.done { color: var(--ok); border-color: var(--border); }
  .ref-box { display: grid; gap: 8px; padding: 10px 12px; border: 1px dashed var(--border); border-radius: var(--radius-ctl); background: var(--subtle); }
  .btn-like { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 10px; border-radius: var(--radius-ctl); border: 1px solid var(--border); background: var(--panel); color: var(--ink); font-size: 12px; font-weight: 500; }
  .btn-like:hover { border-color: var(--accent); color: var(--accent); }
  .ref-preview { display: flex; align-items: center; gap: 10px; }
  .ref-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); }
  .engine-tip { margin: 0; padding: 8px 10px; border-radius: var(--radius-ctl); background: var(--subtle); border: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .preview-wrap { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; }
  @media (max-width: 720px) { .preview-wrap { grid-template-columns: 1fr; } }
  .dolls { display: flex; gap: 12px; align-items: flex-end; justify-content: center; padding: 14px; background: var(--subtle); border: 1px solid var(--border); border-radius: var(--radius-ctl); }
  .doll-col { display: grid; gap: 4px; text-align: center; font-size: 11px; color: var(--muted); }
  .doll-col img { width: 80px; height: 160px; image-rendering: pixelated; }
  .tex-flat { width: 64px; height: 64px; image-rendering: pixelated; border: 1px solid var(--border); border-radius: 6px; background: repeating-conic-gradient(rgba(128,128,128,0.16) 0% 25%, transparent 0% 50%) 50% / 12px 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .msg { font-size: 13px; margin: 0; color: var(--muted); }
  .msg.ok { color: var(--ok); font-weight: 500; }
  .msg.err { color: var(--danger); font-weight: 500; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 13px; color: var(--ink); cursor: pointer; }
  .check input { min-height: auto; width: 16px; height: 16px; accent-color: var(--accent); }
  .history-grid { display: grid; gap: 10px; }
  .hist-item { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-ctl); background: var(--subtle); }
  @media (max-width: 680px) { .hist-item { grid-template-columns: 52px 1fr; } .hist-actions { grid-column: 1 / -1; } }
  .hist-thumb { width: 48px; height: 96px; image-rendering: pixelated; border-radius: 6px; background: var(--panel); border: 1px solid var(--border); object-fit: contain; }
  .hist-meta { display: grid; gap: 3px; min-width: 0; }
  .hist-meta strong { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-meta small { font-size: 12px; color: var(--muted); }
  .hist-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .hist-actions button, .hist-actions a { min-height: 30px; padding: 4px 10px; font-size: 12px; border-radius: var(--radius-ctl); border: 1px solid var(--border); background: var(--panel); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; }
</style>
</head>
<body>
<div class="layout">
  <section class="card">
    <div class="meta-bar" style="justify-content:space-between">
      <div>
        <h2>AI 皮肤工坊</h2>
        <p class="sub">输入角色设定与穿搭描述，自动生成 64×64 Minecraft 标准皮肤，可查看 3D 实时预览并保存或穿戴。</p>
      </div>
      <div id="quota-badges" class="meta-bar"></div>
    </div>

    <div class="chips" id="presets">
      <button type="button" class="chip" data-prompt="银发红瞳少女身穿白金学院制服和百褶裙，头戴小巧蝴蝶结">学院少女</button>
      <button type="button" class="chip" data-prompt="灰黑短发蓝瞳少年，身穿黑蓝配色赛博风连帽卫衣与机能裤，头戴蓝色耳机">赛博少年</button>
      <button type="button" class="chip" data-prompt="棕色长发翡翠绿瞳冒险家，身穿墨绿斗篷与棕色皮革胸甲背带">森系旅人</button>
      <button type="button" class="chip" data-prompt="白金配色重装圣骑士，蓝色披肩与发光金色面甲护胸">圣殿骑士</button>
      <button type="button" class="chip" data-prompt="米白色毛茸茸连帽卫衣，浅棕短发琥珀瞳，脚踩红白帆布鞋">日常卫衣</button>
    </div>

    <label>角色外观描述
      <textarea id="prompt" maxlength="500" placeholder="描述发型发色、瞳色、服饰外套、配饰、鞋履以及期望配色（例如：黑发红瞳少年穿着暗红风衣配黑色工装靴）"></textarea>
    </label>

    <div class="ref-box">
      <div class="row" style="justify-content:space-between">
        <div class="row">
          <label for="ref-file" style="cursor:pointer;display:inline-flex;align-items:center"><span class="btn-like">上传角色参考图（可选）</span></label>
          <input id="ref-file" type="file" accept="image/png,image/jpeg" hidden />
          <span class="sub">上传立绘或服装参考图（PNG / JPG），支持多模态配方解析与图生皮肤</span>
        </div>
        <button id="clear-ref-btn" type="button" hidden>清除参考图</button>
      </div>
      <div id="ref-preview" class="ref-preview" hidden>
        <img id="ref-img" class="ref-thumb" alt="参考图缩略图" />
        <span id="ref-name" class="sub"></span>
      </div>
    </div>

    <div id="refine-banner" hidden class="progress">
      <span id="refine-text" style="flex:1;font-size:13px">正在基于选定结果进行局部微调（退出微调可恢复全新生成）</span>
      <button id="clear-refine" type="button">退出微调</button>
    </div>

    <div class="grid-2">
      <label>生成引擎
        <select id="engine"></select>
      </label>
      <label>手臂模型
        <select id="model">
          <option value="default">经典手臂（Steve 4px）</option>
          <option value="slim">纤细手臂（Alex 3px）</option>
        </select>
      </label>
      <label>风格倾向（可选）
        <select id="style">
          <option value="">自动匹配描述</option>
          <option value="简约日系像素">简约日系像素</option>
          <option value="精致高对比立体阴影">高对比立体阴影</option>
          <option value="写实硬朗战术机能">硬朗机能风</option>
          <option value="复古经典 8-bit 风格">复古经典像素</option>
        </select>
      </label>
    </div>
    <p id="engine-tip" class="engine-tip" hidden></p>

    <div class="row">
      <button id="gen-btn" class="primary" type="button">生成皮肤</button>
      <span id="status-msg" class="msg"></span>
    </div>

    <div id="job-progress" hidden class="progress" aria-live="polite">
      <span class="px-loader" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div class="progress-body">
        <div class="progress-top">
          <span id="job-stage" style="font-size:13px;font-weight:500">正在准备任务…</span>
          <span id="job-elapsed" class="elapsed">已用 0 秒</span>
        </div>
        <div class="step-pills">
          <span class="step-pill active" data-step="connect">连接引擎</span>
          <span class="step-pill" data-step="generate">生成构建</span>
          <span class="step-pill" data-step="validate">UV 质检</span>
        </div>
      </div>
    </div>
  </section>

  <section id="result-card" class="card" hidden>
    <div class="meta-bar" style="justify-content:space-between">
      <div>
        <h2>生成结果预览与保存</h2>
        <p id="result-summary" class="sub"></p>
      </div>
      <div class="row">
        <button id="dl-btn" type="button">下载 64×64 PNG</button>
        <button id="refine-btn" type="button" hidden>在此基础上微调</button>
      </div>
    </div>

    <div class="preview-wrap">
      <div class="dolls">
        <div class="doll-col"><img id="prev-front" alt="正面预览" /><span>正面立绘</span></div>
        <div class="doll-col"><img id="prev-back" alt="背面预览" /><span>背面立绘</span></div>
        <div class="doll-col" style="align-self:center"><img id="prev-raw" class="tex-flat" alt="64×64 材质原图" /><span>64×64 UV</span></div>
      </div>

      <form id="save-form" style="display:grid;gap:10px">
        <label>材质名称<input id="save-name" type="text" maxlength="255" required placeholder="给你的 AI 皮肤起个名字" /></label>
        <label>穿戴到角色（可选）
          <select id="save-char"><option value="0">仅保存至我的材质库（暂不穿戴）</option></select>
        </label>
        <label id="public-wrap" class="check" hidden>
          <input id="save-public" type="checkbox" /> 设为公开，允许其他玩家在公开库浏览与收藏
        </label>
        <div class="row">
          <button id="save-btn" class="primary" type="submit">保存到衣柜并应用</button>
          <span id="save-msg" class="msg"></span>
        </div>
      </form>
    </div>
  </section>

  <section class="card">
    <div class="meta-bar" style="justify-content:space-between">
      <div>
        <h2>近期生成历史（保留 7 天）</h2>
        <p class="sub">离开页面或关闭工坊后仍可找回最近生成的皮肤，支持重新载入 3D 预览、继续微调或保存。</p>
      </div>
      <button id="hist-refresh-btn" type="button">刷新历史</button>
    </div>
    <div id="history-list" class="history-grid"></div>
  </section>
</div>

<script>
(() => {
  const reqMap = new Map();
  const hostMap = new Map();
  let seq = 0;

  let configState = null;
  let activeJob = null;
  let refineState = null; // { jobId, recipe, engine }
  let refImageBase64 = '';
  let pollTimer = null;
  let elapsedTimer = null;
  let jobStartedAt = 0;
  let dirty = false;

  function postResize() {
    window.parent.postMessage({
      type: 'wishingskin:resize',
      height: Math.max(300, Math.ceil(document.documentElement.scrollHeight))
    }, '*');
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(postResize).observe(document.documentElement);
  }
  window.addEventListener('load', postResize);

  function applyHostContext(ctx) {
    if (!ctx || typeof ctx !== 'object') return;
    document.documentElement.dataset.theme = ctx.theme === 'dark' ? 'dark' : 'light';
    if (ctx.tokens && typeof ctx.tokens === 'object') {
      const s = document.documentElement.style;
      const map = {
        panel: '--panel',
        subtle: '--subtle',
        ink: '--ink',
        muted: '--muted',
        border: '--border',
        accent: '--accent',
        accentHover: '--accent-hover',
        accentSoft: '--accent-soft',
        buttonText: '--btn-text',
        error: '--danger',
        errorBg: '--danger-bg',
        radiusCard: '--radius',
        radiusControl: '--radius-ctl',
        shadowCard: '--shadow',
        fontSans: '--font-sans',
        fontDisplay: '--font-display'
      };
      for (const [k, cssVar] of Object.entries(map)) {
        if (typeof ctx.tokens[k] === 'string' && ctx.tokens[k]) s.setProperty(cssVar, ctx.tokens[k]);
      }
    }
    if (typeof ctx.fontFaceCss === 'string') {
      let el = document.getElementById('ws-host-fonts');
      if (!el) {
        el = document.createElement('style');
        el.id = 'ws-host-fonts';
        document.head.appendChild(el);
      }
      el.textContent = ctx.fontFaceCss;
    }
    requestAnimationFrame(postResize);
  }

  window.addEventListener('message', (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'wishingskin:context' && msg.context) {
      applyHostContext(msg.context);
      return;
    }
    if (msg.type === 'wishingskin:response' && reqMap.has(msg.id)) {
      const h = reqMap.get(msg.id); reqMap.delete(msg.id); clearTimeout(h.t);
      h.resolve({ status: msg.status, body: msg.body });
      return;
    }
    if (msg.type === 'wishingskin:host-response' && hostMap.has(msg.id)) {
      const h = hostMap.get(msg.id); hostMap.delete(msg.id); clearTimeout(h.t);
      if (msg.ok) h.resolve(msg.data);
      else h.reject(Object.assign(new Error(msg.error || '操作失败'), { status: msg.status }));
    }
  });

  function callPlugin(method, path, body, query) {
    const id = 'ais-' + (++seq);
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { reqMap.delete(id); reject(new Error('请求超时')); }, 15000);
      reqMap.set(id, { resolve, reject, t });
      window.parent.postMessage({ type: 'wishingskin:request', id, method, path, query, body }, '*');
    });
  }

  function callHost(action, payload) {
    const id = 'aih-' + (++seq);
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { hostMap.delete(id); reject(new Error('宿主响应超时')); }, 15000);
      hostMap.set(id, { resolve, reject, t });
      window.parent.postMessage({ type: 'wishingskin:host', id, action, payload }, '*');
    });
  }

  function setDirty(next) {
    const val = !!next;
    if (dirty === val) return;
    dirty = val;
    callHost('setDirty', { dirty: val }).catch(() => {});
  }

  function setStatus(text, cls) {
    const el = document.getElementById('status-msg');
    el.textContent = text || '';
    el.className = 'msg' + (cls ? ' ' + cls : '');
  }

  function setRefine(next) {
    refineState = next && next.jobId ? next : null;
    const banner = document.getElementById('refine-banner');
    banner.hidden = !refineState;
    if (refineState) {
      document.getElementById('refine-text').textContent = refineState.recipe
        ? '正在基于选定的结构配方进行局部微调（退出微调可恢复全新生成）'
        : ('正在基于任务 ' + refineState.jobId + ' 进行参考重绘或局部修改（退出微调可恢复全新生成）');
    }
    requestAnimationFrame(postResize);
  }

  function setReferenceImage(dataUrl, fileName) {
    refImageBase64 = dataUrl || '';
    const prev = document.getElementById('ref-preview');
    const clearBtn = document.getElementById('clear-ref-btn');
    if (refImageBase64) {
      document.getElementById('ref-img').src = refImageBase64;
      document.getElementById('ref-name').textContent = fileName || '已选择参考图';
      prev.hidden = false;
      clearBtn.hidden = false;
    } else {
      document.getElementById('ref-img').removeAttribute('src');
      document.getElementById('ref-name').textContent = '';
      prev.hidden = true;
      clearBtn.hidden = true;
    }
    requestAnimationFrame(postResize);
  }

  function updateEngineTip() {
    const eng = document.getElementById('engine').value;
    const tip = document.getElementById('engine-tip');
    if (eng === 'image_api') {
      tip.hidden = false;
      tip.textContent = '提示：通用文生图大模型偶发 UV 贴图错位，适合探索纹理创意或结合「以此微调」调整；若需 100% 严丝合缝的服饰结构，建议选择「纯文本 AI 配方合成」或专用 Minecraft Skin 推理节点。';
    } else if (eng === 'async_worker') {
      tip.hidden = false;
      tip.textContent = '已选择专用异步推理节点（适合本地或云端 Minecraft Skin LoRA / Diffusion 服务）。';
    } else {
      tip.hidden = true;
      tip.textContent = '';
    }
    requestAnimationFrame(postResize);
  }

  function updateStageUI(stageText, jobStatus) {
    document.getElementById('job-stage').textContent = stageText || '处理中…';
    const text = String(stageText || '');
    let activeStep = 'connect';
    if (text.includes('UV') || text.includes('质检') || text.includes('校验') || text.includes('结算')) {
      activeStep = 'validate';
    } else if (jobStatus === 'running' && !text.includes('连接')) {
      activeStep = 'generate';
    }
    const order = ['connect', 'generate', 'validate'];
    const activeIdx = order.indexOf(activeStep);
    document.querySelectorAll('#job-progress .step-pill').forEach((el) => {
      const idx = order.indexOf(el.dataset.step);
      el.classList.toggle('active', idx === activeIdx);
      el.classList.toggle('done', idx >= 0 && idx < activeIdx);
    });
  }

  function startJobProgressUI(initialStage) {
    if (elapsedTimer) clearInterval(elapsedTimer);
    jobStartedAt = Date.now();
    document.getElementById('job-progress').hidden = false;
    document.getElementById('job-elapsed').textContent = '已用 0 秒';
    updateStageUI(initialStage || '正在提交任务…', 'queued');
    elapsedTimer = setInterval(() => {
      const sec = Math.max(0, Math.floor((Date.now() - jobStartedAt) / 1000));
      document.getElementById('job-elapsed').textContent = '已用 ' + sec + ' 秒';
    }, 1000);
    const btn = document.getElementById('gen-btn');
    btn.disabled = true;
    btn.textContent = '生成中…';
    requestAnimationFrame(postResize);
  }

  function stopJobProgressUI() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    document.getElementById('job-progress').hidden = true;
    const btn = document.getElementById('gen-btn');
    btn.disabled = false;
    btn.textContent = '生成皮肤';
    requestAnimationFrame(postResize);
  }

  function renderQuotaBadges(cfg) {
    const box = document.getElementById('quota-badges');
    box.innerHTML = '';
    if (!cfg) return;
    const addBadge = (text, accent) => {
      const b = document.createElement('span');
      b.className = 'badge' + (accent ? ' accent' : '');
      b.textContent = text;
      box.appendChild(b);
    };
    if (cfg.pointsCost > 0) {
      addBadge('消耗 ' + cfg.pointsCost + ' 积分 / 次', true);
      if (cfg.balance !== '') addBadge('当前余额 ' + cfg.balance);
    } else {
      addBadge('免费体验', false);
    }
    if (cfg.dailyLimit > 0) {
      addBadge('今日已用 ' + (cfg.usedToday || 0) + ' / ' + cfg.dailyLimit);
    }
  }

  async function loadConfig() {
    const cfgRes = await callPlugin('GET', '/config').catch(() => null);
    if (!cfgRes || cfgRes.status !== 200) return;
    configState = cfgRes.body;
    renderQuotaBadges(configState);

    const engSel = document.getElementById('engine');
    engSel.innerHTML = '';
    for (const eng of configState.engines || []) {
      if (!eng.configured) continue;
      const opt = document.createElement('option');
      opt.value = eng.id;
      opt.textContent = eng.label;
      engSel.appendChild(opt);
    }
    if (engSel.options.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '管理员尚未启用任何生成引擎';
      engSel.appendChild(opt);
      document.getElementById('gen-btn').disabled = true;
    } else {
      if (configState.defaultEngine && [...engSel.options].some(o => o.value === configState.defaultEngine)) {
        engSel.value = configState.defaultEngine;
      }
      if (!pollTimer) document.getElementById('gen-btn').disabled = false;
    }
    updateEngineTip();
    document.getElementById('public-wrap').hidden = !configState.allowPublicSave;

    if (configState.activeJobId && !pollTimer) {
      startJobProgressUI('恢复进行中的生成任务…');
      startPolling(configState.activeJobId);
    }
  }

  async function loadCharacters() {
    const charData = await callHost('listCharacters').catch(() => ({ characters: [] }));
    const charSel = document.getElementById('save-char');
    charSel.innerHTML = '<option value="0">仅保存至我的材质库（暂不穿戴）</option>';
    for (const c of (charData && charData.characters) || []) {
      const opt = document.createElement('option');
      opt.value = String(c.id);
      opt.textContent = c.name + (c.model === 'slim' ? '（纤细）' : '（经典）');
      charSel.appendChild(opt);
    }
  }

  function showJobResult(job, markUnsaved = true) {
    activeJob = job;
    document.getElementById('result-card').hidden = false;
    document.getElementById('result-summary').textContent = (job.summary || '皮肤已通过 64×64 UV 规范质检') + (job.durationMs ? '（耗时 ' + job.durationMs + ' ms）' : '');
    const frontEl = document.getElementById('prev-front');
    const backEl = document.getElementById('prev-back');
    if (job.frontPreviewBase64) frontEl.src = 'data:image/png;base64,' + job.frontPreviewBase64;
    else frontEl.removeAttribute('src');
    if (job.backPreviewBase64) backEl.src = 'data:image/png;base64,' + job.backPreviewBase64;
    else backEl.removeAttribute('src');
    document.getElementById('prev-raw').src = 'data:image/png;base64,' + job.pngBase64;
    document.getElementById('save-name').value = (job.prompt || 'AI 皮肤').slice(0, 28);
    document.getElementById('refine-btn').hidden = !job.jobId;
    document.getElementById('save-msg').textContent = '';

    callHost('setPreview', {
      pngBase64: job.pngBase64,
      model: job.model === 'slim' ? 'slim' : 'default',
      title: 'AI 皮肤 3D 预览'
    }).catch(() => {});

    setDirty(markUnsaved);
    requestAnimationFrame(postResize);
  }

  async function loadHistory() {
    const listEl = document.getElementById('history-list');
    try {
      const res = await callPlugin('GET', '/history');
      if (res.status !== 200) {
        listEl.innerHTML = '<p class="sub">暂无法读取历史记录。</p>';
        return;
      }
      const items = (res.body && res.body.items) || [];
      listEl.innerHTML = '';
      if (items.length === 0) {
        listEl.innerHTML = '<p class="sub">最近 7 天暂无生成记录，点击上方按钮开始创作你的第一份 AI 皮肤。</p>';
        requestAnimationFrame(postResize);
        return;
      }
      for (const item of items) {
        const row = document.createElement('div');
        row.className = 'hist-item';

        const img = document.createElement('img');
        img.className = 'hist-thumb';
        img.src = 'data:image/png;base64,' + (item.frontPreviewBase64 || item.pngBase64);
        img.alt = item.prompt || '历史皮肤';

        const meta = document.createElement('div');
        meta.className = 'hist-meta';
        const title = document.createElement('strong');
        title.textContent = item.prompt || '未命名生成记录';
        const timeStr = item.createdAt ? new Date(item.createdAt).toLocaleString() : '';
        const info = document.createElement('small');
        info.textContent = (item.model === 'slim' ? 'Alex 3px' : 'Steve 4px') + '  ' + timeStr;
        const sum = document.createElement('small');
        sum.textContent = item.summary || '';
        meta.append(title, info);
        if (item.summary) meta.appendChild(sum);

        const actions = document.createElement('div');
        actions.className = 'hist-actions';

        const loadBtn = document.createElement('button');
        loadBtn.type = 'button';
        loadBtn.textContent = '载入预览';
        loadBtn.addEventListener('click', () => {
          document.getElementById('prompt').value = item.prompt || '';
          document.getElementById('model').value = item.model === 'slim' ? 'slim' : 'default';
          showJobResult(item, false);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        actions.appendChild(loadBtn);

        const refBtn = document.createElement('button');
        refBtn.type = 'button';
        refBtn.textContent = '以此微调';
        refBtn.addEventListener('click', () => {
          document.getElementById('prompt').value = item.prompt || '';
          document.getElementById('model').value = item.model === 'slim' ? 'slim' : 'default';
          const engSel = document.getElementById('engine');
          if (item.engine && [...engSel.options].some(o => o.value === item.engine)) {
            engSel.value = item.engine;
            updateEngineTip();
          }
          setRefine({ jobId: item.jobId, recipe: item.recipe || null, engine: item.engine || '' });
          showJobResult(item, false);
          document.getElementById('prompt').focus();
          setStatus('请在上方输入修改需求（例如“把头发改成紫色并加上红色围巾”），再点击生成。', '');
        });
        actions.appendChild(refBtn);

        const dlBtn = document.createElement('button');
        dlBtn.type = 'button';
        dlBtn.textContent = '下载 PNG';
        dlBtn.addEventListener('click', () => {
          callHost('downloadFile', {
            filename: (item.jobId || 'ai-skin') + '.png',
            mimeType: 'image/png',
            dataBase64: item.pngBase64
          }).catch(() => {});
        });
        actions.appendChild(dlBtn);

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'danger';
        delBtn.textContent = '删除';
        delBtn.addEventListener('click', async () => {
          delBtn.disabled = true;
          try {
            const dr = await callPlugin('POST', '/history/delete', { jobId: item.jobId });
            if (dr.status === 200) {
              if (refineState && refineState.jobId === item.jobId) setRefine(null);
              await loadHistory();
            }
          } finally {
            delBtn.disabled = false;
          }
        });
        actions.appendChild(delBtn);

        row.append(img, meta, actions);
        listEl.appendChild(row);
      }
      requestAnimationFrame(postResize);
    } catch {
      listEl.innerHTML = '<p class="sub">读取历史记录时发生网络超时。</p>';
    }
  }

  function startPolling(jobId) {
    if (pollTimer) clearInterval(pollTimer);
    const poll = async () => {
      try {
        const res = await callPlugin('GET', '/jobs', undefined, 'id=' + encodeURIComponent(jobId));
        if (res.status !== 200) {
          stopJobProgressUI();
          setStatus((res.body && res.body.error) || '查询任务失败', 'err');
          return;
        }
        const job = res.body;
        updateStageUI(job.stage || '处理中…', job.status);
        if (job.status === 'succeeded') {
          stopJobProgressUI();
          showJobResult(job, true);
          setStatus('生成完成！可先查看 3D 预览，满意后再保存至衣柜。', 'ok');
          await Promise.all([loadConfig(), loadHistory()]);
        } else if (job.status === 'failed') {
          stopJobProgressUI();
          setStatus(job.error || '生成失败（未扣费）', 'err');
        }
      } catch (err) {
        stopJobProgressUI();
        setStatus(err.message || '轮询状态失败', 'err');
      }
    };
    void poll();
    pollTimer = setInterval(() => void poll(), 1200);
  }

  function resizeRefFileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('读取参考图失败'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('无法解析所选图片格式'));
        img.onload = () => {
          const maxSide = 768;
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          if (w > maxSide || h > maxSide) {
            const ratio = Math.min(maxSide / w, maxSide / h);
            w = Math.max(1, Math.round(w * ratio));
            h = Math.max(1, Math.round(h * ratio));
          }
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          let out = c.toDataURL('image/png');
          if (out.length > 1500000) {
            out = c.toDataURL('image/jpeg', 0.9);
          }
          resolve(out);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('ref-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await resizeRefFileToDataUrl(file);
      setReferenceImage(dataUrl, file.name);
      setStatus('', '');
    } catch (err) {
      setStatus((err && err.message) || '参考图处理失败', 'err');
    } finally {
      e.target.value = '';
    }
  });

  document.getElementById('clear-ref-btn').addEventListener('click', () => setReferenceImage('', ''));
  document.getElementById('engine').addEventListener('change', updateEngineTip);

  document.getElementById('presets').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-prompt]');
    if (!btn) return;
    document.getElementById('prompt').value = btn.dataset.prompt;
    setRefine(null);
  });

  document.getElementById('clear-refine').addEventListener('click', () => setRefine(null));
  document.getElementById('refine-btn').addEventListener('click', () => {
    if (!activeJob || !activeJob.jobId) return;
    const engSel = document.getElementById('engine');
    if (activeJob.engine && [...engSel.options].some(o => o.value === activeJob.engine)) {
      engSel.value = activeJob.engine;
      updateEngineTip();
    }
    setRefine({ jobId: activeJob.jobId, recipe: activeJob.recipe || null, engine: activeJob.engine || '' });
    document.getElementById('prompt').focus();
    setStatus('请在上方输入修改需求（例如“把头发改成紫色并加上红色围巾”），再点击生成。', '');
  });

  document.getElementById('dl-btn').addEventListener('click', () => {
    if (!activeJob || !activeJob.pngBase64) return;
    const rawName = document.getElementById('save-name').value.trim() || 'ai-skin';
    callHost('downloadFile', {
      filename: rawName + '.png',
      mimeType: 'image/png',
      dataBase64: activeJob.pngBase64
    }).catch(() => {});
  });

  document.getElementById('gen-btn').addEventListener('click', async () => {
    const prompt = document.getElementById('prompt').value.trim();
    const engine = document.getElementById('engine').value;
    if (!prompt) { setStatus('请先输入角色外观描述', 'err'); return; }
    if (!engine) { setStatus('没有可用的 AI 生成引擎', 'err'); return; }

    setStatus('', '');
    startJobProgressUI('正在提交任务…');

    try {
      const payload = {
        prompt,
        engine,
        model: document.getElementById('model').value,
        style: document.getElementById('style').value
      };
      if (refineState && refineState.jobId) {
        payload.baseJobId = refineState.jobId;
        if (refineState.recipe) payload.baseRecipe = refineState.recipe;
      }
      if (refImageBase64) {
        payload.referenceImageBase64 = refImageBase64;
      }
      const res = await callPlugin('POST', '/generate', payload);
      if (res.status !== 202) {
        stopJobProgressUI();
        setStatus((res.body && res.body.error) || '提交生成失败', 'err');
        return;
      }
      updateStageUI(res.body.stage || '任务已入队…', res.body.status || 'queued');
      startPolling(res.body.jobId);
    } catch (err) {
      stopJobProgressUI();
      setStatus(err.message || '请求失败', 'err');
    }
  });

  document.getElementById('save-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!activeJob || !activeJob.jobId) return;
    const msgEl = document.getElementById('save-msg');
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = '保存中…';
    msgEl.className = 'msg'; msgEl.textContent = '';

    try {
      const charId = Number(document.getElementById('save-char').value) || 0;
      const res = await callPlugin('POST', '/save', {
        jobId: activeJob.jobId,
        name: document.getElementById('save-name').value.trim(),
        model: document.getElementById('model').value,
        isPublic: !document.getElementById('public-wrap').hidden && document.getElementById('save-public').checked,
        characterId: charId
      });
      if (res.status !== 200) {
        msgEl.className = 'msg err';
        msgEl.textContent = (res.body && res.body.error) || '保存失败';
        return;
      }
      setDirty(false);
      msgEl.className = 'msg ok';
      msgEl.textContent = res.body.pendingReview
        ? '已提交保存，正在等待站点审核通过后生效。'
        : (res.body.bound ? '已保存到衣柜并穿戴到所选角色！' : '已保存到我的材质库！');
      callHost('notify', { message: msgEl.textContent, kind: 'success' }).catch(() => {});
      callHost('notifyMutated', { textures: true, characters: charId > 0 && !res.body.pendingReview }).catch(() => {});
    } catch (err) {
      msgEl.className = 'msg err';
      msgEl.textContent = err.message || '保存失败';
    } finally {
      btn.disabled = false; btn.textContent = '保存到衣柜并应用';
    }
  });

  document.getElementById('hist-refresh-btn').addEventListener('click', () => void loadHistory());

  function init() {
    void loadConfig();
    void loadCharacters();
    void loadHistory();
  }
  init();
})();
</script>
</body>
</html>

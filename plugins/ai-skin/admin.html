<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI 皮肤工坊管理与测试</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: transparent;
    --panel: #ffffff;
    --subtle: #f4f4f6;
    --ink: #18181b;
    --muted: #52525b;
    --border: #e4e4e7;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: rgba(37, 99, 235, 0.12);
    --btn-text: #ffffff;
    --ok: #15803d;
    --ok-bg: rgba(22, 163, 74, 0.12);
    --danger: #b91c1c;
    --danger-bg: rgba(185, 28, 28, 0.12);
    --radius: 12px;
    --radius-ctl: 9px;
    --shadow: none;
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-display: var(--font-sans);
  }
  :root[data-theme="dark"] {
    --panel: #18181b;
    --subtle: #202024;
    --ink: #f4f4f5;
    --muted: #a1a1aa;
    --border: #2e2e34;
    --accent: #60a5fa;
    --accent-hover: #3b82f6;
    --ok: #4ade80;
    --ok-bg: rgba(74, 222, 128, 0.14);
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.14);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; padding: 4px; background: transparent; color: var(--ink); font: 14px/1.55 var(--font-sans); }
  .stack { display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; font-family: var(--font-display); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--subtle); border: 1px solid var(--border); border-radius: var(--radius-ctl); padding: 10px 12px; }
  .stat span { display: block; font-size: 12px; color: var(--muted); }
  .stat strong { font-size: 18px; font-variant-numeric: tabular-nums; }
  .engine-list { display: grid; gap: 8px; }
  .eng-item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-ctl); background: var(--subtle); }
  .eng-meta { display: grid; gap: 2px; }
  .eng-meta small { color: var(--muted); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.off { background: var(--subtle); color: var(--muted); border: 1px solid var(--border); }
  .pill.err { background: var(--danger-bg); color: var(--danger); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select, button { font: inherit; min-height: 36px; border-radius: var(--radius-ctl); border: 1px solid var(--border); background: var(--panel); color: var(--ink); padding: 6px 10px; }
  input.grow { flex: 1; min-width: 200px; }
  button { cursor: pointer; font-weight: 500; transition: background-color 140ms ease, border-color 140ms ease; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--btn-text); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .preview-box { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-ctl); background: var(--subtle); }
  .preview-box img { width: 48px; height: 96px; image-rendering: pixelated; border-radius: 6px; background: var(--panel); border: 1px solid var(--border); }
  .px-loader { display: grid; grid-template-columns: repeat(2, 7px); gap: 2px; flex-shrink: 0; }
  .px-loader i { display: block; width: 7px; height: 7px; border-radius: 1px; background: var(--accent); animation: px-step 1s steps(4, end) infinite; }
  .px-loader i:nth-child(2) { animation-delay: -0.75s; }
  .px-loader i:nth-child(4) { animation-delay: -0.5s; }
  .px-loader i:nth-child(3) { animation-delay: -0.25s; }
  @keyframes px-step { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .px-loader i { animation: none; opacity: 0.8; } }
  .elapsed { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .muted { color: var(--muted); font-size: 13px; margin: 0; }
</style>
</head>
<body>
<div class="stack">
  <section class="card">
    <div class="row" style="justify-content:space-between">
      <h2>AI 皮肤工坊运行概览</h2>
      <button id="refresh-btn" type="button">刷新</button>
    </div>
    <div id="stats" class="grid"></div>
    <div id="engines" class="engine-list"></div>
  </section>

  <section class="card">
    <h2>连通性测试</h2>
    <p class="muted">管理员干跑测试不消耗个人每日额度，且不扣除站点积分。修改插件设置保存后将自动同步此处状态。</p>
    <form id="test-form" class="row">
      <select id="t-engine"></select>
      <input id="t-prompt" class="grow" type="text" value="银发蓝瞳少年穿着白色科技卫衣" maxlength="200" placeholder="输入皮肤测试描述" />
      <select id="t-model">
        <option value="default">Steve (4px)</option>
        <option value="slim">Alex (3px)</option>
      </select>
      <button id="test-btn" class="primary" type="submit">执行测试</button>
    </form>
    <div id="test-progress" hidden class="preview-box" aria-live="polite">
      <span class="px-loader" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span id="test-stage" style="font-size:13px">正在准备测试任务…</span>
      <span id="test-elapsed" class="elapsed">已用 0 秒</span>
    </div>
    <div id="test-result" hidden class="preview-box"></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <h2>近期生成记录（最多保留 50 条）</h2>
      <button id="clear-btn" type="button">清空记录</button>
    </div>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>时间</th><th>用户 ID</th><th>引擎</th><th>状态</th><th>耗时</th><th>摘要或错误</th></tr></thead>
        <tbody id="logs-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
(() => {
  const reqMap = new Map();
  let seq = 0;

  function postResize() {
    window.parent.postMessage({
      type: 'wishingskin:resize',
      height: Math.max(280, Math.ceil(document.documentElement.scrollHeight))
    }, '*');
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(postResize).observe(document.documentElement);
  }
  window.addEventListener('load', postResize);

  function applyHostContext(ctx) {
    if (!ctx || typeof ctx !== 'object') return;
    document.documentElement.dataset.theme = ctx.theme === 'dark' ? 'dark' : 'light';
    if (ctx.tokens && typeof ctx.tokens === 'object') {
      const s = document.documentElement.style;
      const map = {
        panel: '--panel',
        subtle: '--subtle',
        ink: '--ink',
        muted: '--muted',
        border: '--border',
        accent: '--accent',
        accentHover: '--accent-hover',
        accentSoft: '--accent-soft',
        buttonText: '--btn-text',
        error: '--danger',
        errorBg: '--danger-bg',
        radiusCard: '--radius',
        radiusControl: '--radius-ctl',
        shadowCard: '--shadow',
        fontSans: '--font-sans',
        fontDisplay: '--font-display'
      };
      for (const [k, cssVar] of Object.entries(map)) {
        if (typeof ctx.tokens[k] === 'string' && ctx.tokens[k]) s.setProperty(cssVar, ctx.tokens[k]);
      }
    }
    if (typeof ctx.fontFaceCss === 'string') {
      let el = document.getElementById('ws-host-fonts');
      if (!el) {
        el = document.createElement('style');
        el.id = 'ws-host-fonts';
        document.head.appendChild(el);
      }
      el.textContent = ctx.fontFaceCss;
    }
    requestAnimationFrame(postResize);
  }

  window.addEventListener('message', (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'wishingskin:context' && msg.context) {
      applyHostContext(msg.context);
      return;
    }
    if (msg.type === 'wishingskin:settings-updated') {
      void refresh();
      return;
    }
    if (msg.type === 'wishingskin:response' && reqMap.has(msg.id)) {
      const h = reqMap.get(msg.id); reqMap.delete(msg.id); clearTimeout(h.t);
      h.resolve({ status: msg.status, body: msg.body });
    }
  });

  function callPlugin(method, path, body, query, timeoutMs = 15000) {
    const id = 'aia-' + (++seq);
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { reqMap.delete(id); reject(new Error('请求超时')); }, timeoutMs);
      reqMap.set(id, { resolve, reject, t });
      window.parent.postMessage({ type: 'wishingskin:request', id, method, path, query, body }, '*');
    });
  }

  function makeStat(label, val) {
    const d = document.createElement('div'); d.className = 'stat';
    const s = document.createElement('span'); s.textContent = label;
    const b = document.createElement('strong'); b.textContent = String(val);
    d.append(s, b);
    return d;
  }

  async function refresh() {
    const res = await callPlugin('GET', '/admin/status');
    if (res.status !== 200) return;
    const d = res.body;

    const statsEl = document.getElementById('stats');
    statsEl.innerHTML = '';
    statsEl.append(
      makeStat('进行中任务', d.activeJobs || 0),
      makeStat('今日已生成', d.todayTotal || 0),
      makeStat('累计成功', (d.stats && d.stats.totalGenerated) || 0),
      makeStat('累计失败', (d.stats && d.stats.totalFailed) || 0),
      makeStat('保存入库次数', (d.stats && d.stats.totalSaved) || 0)
    );

    const engEl = document.getElementById('engines');
    const selEl = document.getElementById('t-engine');
    const prevVal = selEl.value;
    engEl.innerHTML = '';
    selEl.innerHTML = '';
    for (const eng of d.engines || []) {
      const item = document.createElement('div'); item.className = 'eng-item';
      const meta = document.createElement('div'); meta.className = 'eng-meta';
      const title = document.createElement('strong');
      title.textContent = eng.label + (d.defaultEngine === eng.id ? '（当前默认）' : '');
      const hint = document.createElement('small'); hint.textContent = eng.hint;
      meta.append(title, hint);
      const pill = document.createElement('span');
      pill.className = 'pill ' + (eng.configured ? 'ok' : 'off');
      pill.textContent = eng.configured ? '已就绪' : '未配置';
      item.append(meta, pill);
      engEl.appendChild(item);

      if (eng.configured) {
        const opt = document.createElement('option');
        opt.value = eng.id;
        opt.textContent = eng.label;
        selEl.appendChild(opt);
      }
    }
    if (prevVal && [...selEl.options].some(o => o.value === prevVal)) {
      selEl.value = prevVal;
    } else if (d.defaultEngine && [...selEl.options].some(o => o.value === d.defaultEngine)) {
      selEl.value = d.defaultEngine;
    }
    if (selEl.options.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '暂无可用引擎（请先保存配置）';
      selEl.appendChild(opt);
    }

    const tbody = document.getElementById('logs-body');
    tbody.innerHTML = '';
    const logs = d.logs || [];
    if (logs.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 6; td.className = 'muted'; td.textContent = '暂无生成日志';
      tr.appendChild(td); tbody.appendChild(tr);
    } else {
      for (const row of logs) {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td'); td1.textContent = row.time || '';
        const td2 = document.createElement('td'); td2.textContent = String(row.userId || 0);
        const td3 = document.createElement('td'); td3.textContent = row.engine || '';
        const td4 = document.createElement('td');
        const pill = document.createElement('span');
        pill.className = 'pill ' + (row.status === 'succeeded' ? 'ok' : 'err');
        pill.textContent = row.status === 'succeeded' ? '成功' : '失败';
        td4.appendChild(pill);
        const td5 = document.createElement('td'); td5.textContent = (row.durationMs || 0) + ' ms';
        const td6 = document.createElement('td'); td6.textContent = row.detail || '';
        tr.append(td1, td2, td3, td4, td5, td6);
        tbody.appendChild(tr);
      }
    }
    requestAnimationFrame(postResize);
  }

  document.getElementById('refresh-btn').addEventListener('click', () => void refresh());

  let testTimer = null;
  let elapsedTimer = null;

  function stopTestTimers() {
    if (testTimer) { clearInterval(testTimer); testTimer = null; }
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
  }

  function renderTestResult(ok, durMs, summaryOrErr, frontBase64) {
    const outBox = document.getElementById('test-result');
    outBox.hidden = false;
    outBox.innerHTML = '';
    if (!ok) {
      outBox.textContent = '测试失败（' + (durMs || 0) + ' ms）：' + (summaryOrErr || '未知错误');
      return;
    }
    const img = document.createElement('img');
    img.src = 'data:image/png;base64,' + frontBase64;
    img.alt = '测试立绘';
    const meta = document.createElement('div');
    meta.innerHTML = '<strong>测试通过（' + durMs + ' ms）</strong>';
    const p = document.createElement('p'); p.className = 'muted'; p.textContent = summaryOrErr || 'UV 校验已通过';
    meta.appendChild(p);
    outBox.append(img, meta);
  }

  document.getElementById('test-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const eng = document.getElementById('t-engine').value;
    const outBox = document.getElementById('test-result');
    const progBox = document.getElementById('test-progress');
    const stageEl = document.getElementById('test-stage');
    const elapsedEl = document.getElementById('test-elapsed');
    if (!eng) {
      outBox.hidden = false;
      outBox.textContent = '请先配置并保存至少一种引擎（或启用内置演示模式）。';
      return;
    }
    stopTestTimers();
    const btn = document.getElementById('test-btn');
    btn.disabled = true; btn.textContent = '测试中…';
    outBox.hidden = true;
    progBox.hidden = false;
    stageEl.textContent = '正在启动管理员干跑测试…';
    const startedAt = Date.now();
    elapsedEl.textContent = '已用 0 秒';
    elapsedTimer = setInterval(() => {
      elapsedEl.textContent = '已用 ' + Math.floor((Date.now() - startedAt) / 1000) + ' 秒';
    }, 1000);

    const doneCleanup = () => {
      stopTestTimers();
      progBox.hidden = true;
      btn.disabled = false;
      btn.textContent = '执行测试';
      requestAnimationFrame(postResize);
    };

    try {
      const res = await callPlugin('POST', '/admin/test', {
        engine: eng,
        prompt: document.getElementById('t-prompt').value.trim(),
        model: document.getElementById('t-model').value,
        async: true
      });
      if (res.status === 202 && res.body && res.body.jobId) {
        const jobId = res.body.jobId;
        const poll = async () => {
          try {
            const jr = await callPlugin('GET', '/jobs', undefined, 'id=' + encodeURIComponent(jobId));
            if (jr.status !== 200 || !jr.body) {
              doneCleanup();
              renderTestResult(false, Date.now() - startedAt, (jr.body && jr.body.error) || '查询测试任务失败');
              return;
            }
            const job = jr.body;
            stageEl.textContent = job.stage || '正在验证模型响应…';
            if (job.status === 'succeeded') {
              doneCleanup();
              renderTestResult(true, job.durationMs || (Date.now() - startedAt), job.summary, job.frontPreviewBase64);
              await refresh();
            } else if (job.status === 'failed') {
              doneCleanup();
              renderTestResult(false, job.durationMs || (Date.now() - startedAt), job.error);
              await refresh();
            }
          } catch (err) {
            doneCleanup();
            renderTestResult(false, Date.now() - startedAt, err.message || '轮询失败');
          }
        };
        await poll();
        if (btn.disabled) {
          testTimer = setInterval(() => void poll(), 1200);
        }
        return;
      }
      doneCleanup();
      if (res.status !== 200 || !res.body || !res.body.ok) {
        renderTestResult(false, (res.body && res.body.durationMs) || (Date.now() - startedAt), (res.body && (res.body.error || res.body.message)) || '未知错误');
      } else {
        renderTestResult(true, res.body.durationMs, res.body.summary, res.body.frontPreviewBase64);
      }
      await refresh();
    } catch (err) {
      doneCleanup();
      renderTestResult(false, Date.now() - startedAt, err.message || '请求失败');
    }
  });

  document.getElementById('clear-btn').addEventListener('click', async () => {
    await callPlugin('POST', '/admin/clear-logs');
    await refresh();
  });

  void refresh();
})();
</script>
</body>
</html>

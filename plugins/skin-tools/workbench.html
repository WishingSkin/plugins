<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>皮肤格式转换与调色工作台</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: transparent;
    --panel: #ffffff;
    --subtle: #f4f4f6;
    --ink: #18181b;
    --muted: #52525b;
    --border: #e4e4e7;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: rgba(37, 99, 235, 0.12);
    --btn-text: #ffffff;
    --ok: #15803d;
    --danger: #b91c1c;
    --radius: 12px;
    --radius-ctl: 9px;
    --shadow: none;
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-display: var(--font-sans);
  }
  :root[data-theme="dark"] {
    --panel: #18181b;
    --subtle: #202024;
    --ink: #f4f4f5;
    --muted: #a1a1aa;
    --border: #2e2e34;
    --accent: #60a5fa;
    --accent-hover: #3b82f6;
    --ok: #4ade80;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 4px; background: transparent; color: var(--ink); font: 14px/1.55 var(--font-sans); }
  .layout { display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; }
  h2 { margin: 0; font-size: 16px; font-weight: 600; font-family: var(--font-display); }
  .sub { margin: 0; font-size: 13px; color: var(--muted); }
  .split { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(280px, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  label.field { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 600; }
  select, input[type="text"], button { font: inherit; min-height: 36px; border-radius: var(--radius-ctl); border: 1px solid var(--border); background: var(--panel); color: var(--ink); padding: 6px 10px; }
  button { cursor: pointer; font-weight: 500; transition: background-color 140ms ease, border-color 140ms ease; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--btn-text); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }
  .slider-row { display: grid; gap: 4px; }
  .slider-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 600; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .source-pill { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-ctl); background: var(--subtle); border: 1px solid var(--border); font-size: 13px; }
  .source-pill img { width: 32px; height: 32px; image-rendering: pixelated; border-radius: 5px; border: 1px solid var(--border); }
  .dolls { display: flex; gap: 14px; justify-content: center; align-items: flex-end; padding: 14px; border-radius: var(--radius-ctl); background: var(--subtle); border: 1px solid var(--border); }
  .doll { display: grid; gap: 4px; text-align: center; font-size: 11px; color: var(--muted); }
  .doll img { width: 80px; height: 160px; image-rendering: pixelated; }
  .msg { font-size: 13px; margin: 0; color: var(--muted); }
  .msg.ok { color: var(--ok); font-weight: 500; }
  .msg.err { color: var(--danger); font-weight: 500; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="layout">
  <section class="card">
    <div>
      <h2>皮肤格式转换与调色工具箱</h2>
      <p class="sub">一键完成 64×32 旧版皮肤升级、Steve 与 Alex 手臂无损转换、HSL 调色与透明杂点清理。</p>
    </div>
    <div class="row">
      <button id="pick-site-btn" class="primary" type="button">从站点皮肤库选择</button>
      <label for="local-file" style="cursor:pointer"><span style="display:inline-flex;align-items:center;min-height:36px;padding:6px 12px;border-radius:var(--radius-ctl);border:1px solid var(--border);background:var(--panel);font-weight:500">上传本地 PNG</span></label>
      <input id="local-file" type="file" accept="image/png" />
      <select id="base-model">
        <option value="default">当前模型：经典（Steve 4px）</option>
        <option value="slim">当前模型：纤细（Alex 3px）</option>
      </select>
    </div>
    <div id="source-pill" class="source-pill" hidden>
      <img id="source-thumb" alt="源皮肤缩略图" />
      <div style="flex:1;min-width:0">
        <strong id="source-name" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></strong>
        <span id="source-meta" class="sub" style="font-size:12px"></span>
      </div>
    </div>
  </section>

  <div class="split">
    <section class="card">
      <h2>转换与调色选项</h2>
      <label class="field">手臂模型转换
        <select id="arm-convert">
          <option value="">保持不变</option>
          <option value="to_slim">转换为纤细手臂（Steve 转 Alex 3px）</option>
          <option value="to_classic">转换为经典手臂（Alex 转 Steve 4px）</option>
        </select>
      </label>
      <label class="check"><input id="opt-upgrade" type="checkbox" checked /> 自动将 64×32 旧版皮肤升级为 64×64</label>
      <label class="check"><input id="opt-clean-alpha" type="checkbox" checked /> 清理边缘微弱半透明噪点</label>
      <label class="check"><input id="opt-strip-outer" type="checkbox" /> 剥离全部第二层饰品区域（帽子、外套、袖套、裤腿）</label>
      <label class="check"><input id="opt-grayscale" type="checkbox" /> 转为黑白灰阶配色</label>

      <div class="slider-row">
        <div class="slider-head"><span>色相偏移</span><span id="val-hue">0&deg;</span></div>
        <input id="sl-hue" type="range" min="-180" max="180" step="5" value="0" />
      </div>
      <div class="slider-row">
        <div class="slider-head"><span>饱和度调节</span><span id="val-sat">0%</span></div>
        <input id="sl-sat" type="range" min="-100" max="100" step="5" value="0" />
      </div>
      <div class="slider-row">
        <div class="slider-head"><span>亮度调节</span><span id="val-bright">0%</span></div>
        <input id="sl-bright" type="range" min="-100" max="100" step="5" value="0" />
      </div>

      <div class="row">
        <button id="reset-btn" type="button">重置所有调节</button>
        <span id="tool-msg" class="msg"></span>
      </div>
    </section>

    <section class="card">
      <h2>实时效果预览与保存</h2>
      <div id="preview-area" hidden>
        <div class="dolls">
          <div class="doll"><img id="prev-front" alt="正面预览" /><span>正面立绘</span></div>
          <div class="doll"><img id="prev-back" alt="背面预览" /><span>背面立绘</span></div>
        </div>
        <p id="out-meta" class="sub" style="margin-top:8px;text-align:center"></p>
      </div>
      <p id="preview-empty" class="sub">请先从站点皮肤库选择或上传一份本地 PNG 皮肤文件。</p>

      <form id="save-form" style="display:grid;gap:10px">
        <label class="field">新皮肤名称
          <input id="save-name" type="text" maxlength="255" required value="处理后皮肤" />
        </label>
        <label class="field">保存后同时穿戴到角色（可选）
          <select id="save-char"><option value="0">仅保存到我的材质库</option></select>
        </label>
        <div class="row">
          <button id="save-btn" class="primary" type="submit" disabled>保存为新材质</button>
          <a id="dl-link" download="converted-skin.png" hidden><button type="button">下载 PNG</button></a>
          <span id="save-msg" class="msg"></span>
        </div>
      </form>
    </section>
  </div>
</div>

<script>
(() => {
  const reqMap = new Map();
  const hostMap = new Map();
  let seq = 0;

  let baseSkin = null;
  let lastResult = null;
  let debounceTimer = null;
  let dirty = false;

  function postResize() {
    window.parent.postMessage({
      type: 'wishingskin:resize',
      height: Math.max(300, Math.ceil(document.documentElement.scrollHeight))
    }, '*');
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(postResize).observe(document.documentElement);
  }
  window.addEventListener('load', postResize);

  function applyHostContext(ctx) {
    if (!ctx || typeof ctx !== 'object') return;
    document.documentElement.dataset.theme = ctx.theme === 'dark' ? 'dark' : 'light';
    if (ctx.tokens && typeof ctx.tokens === 'object') {
      const s = document.documentElement.style;
      const map = {
        panel: '--panel', subtle: '--subtle', ink: '--ink', muted: '--muted', border: '--border',
        accent: '--accent', accentHover: '--accent-hover', accentSoft: '--accent-soft',
        buttonText: '--btn-text', error: '--danger', errorBg: '--danger-bg',
        radiusCard: '--radius', radiusControl: '--radius-ctl', shadowCard: '--shadow',
        fontSans: '--font-sans', fontDisplay: '--font-display'
      };
      for (const [k, cssVar] of Object.entries(map)) {
        if (typeof ctx.tokens[k] === 'string' && ctx.tokens[k]) s.setProperty(cssVar, ctx.tokens[k]);
      }
    }
    if (typeof ctx.fontFaceCss === 'string') {
      let el = document.getElementById('ws-host-fonts');
      if (!el) { el = document.createElement('style'); el.id = 'ws-host-fonts'; document.head.appendChild(el); }
      el.textContent = ctx.fontFaceCss;
    }
    if (!baseSkin && ctx.textureHash) {
      setSourceSkin({
        fileHash: ctx.textureHash,
        name: ctx.textureName || '当前皮肤',
        model: ctx.textureModel === 'slim' ? 'slim' : 'default'
      });
    }
    requestAnimationFrame(postResize);
  }

  window.addEventListener('message', (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'wishingskin:context' && msg.context) { applyHostContext(msg.context); return; }
    if (msg.type === 'wishingskin:response' && reqMap.has(msg.id)) {
      const h = reqMap.get(msg.id); reqMap.delete(msg.id); clearTimeout(h.t);
      h.resolve({ status: msg.status, body: msg.body });
      return;
    }
    if (msg.type === 'wishingskin:host_result' && hostMap.has(msg.id)) {
      const h = hostMap.get(msg.id); hostMap.delete(msg.id); clearTimeout(h.t);
      if (msg.ok) h.resolve(msg.data);
      else h.reject(Object.assign(new Error(msg.error || '操作失败'), { status: msg.status }));
    }
  });

  function callPlugin(method, path, body) {
    const id = 'st-' + (++seq);
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { reqMap.delete(id); reject(new Error('请求超时')); }, 12000);
      reqMap.set(id, { resolve, reject, t });
      window.parent.postMessage({ type: 'wishingskin:request', id, method, path, body }, '*');
    });
  }

  function callHost(action, payload) {
    const id = 'sth-' + (++seq);
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { hostMap.delete(id); reject(new Error('宿主响应超时')); }, 60000);
      hostMap.set(id, { resolve, reject, t });
      window.parent.postMessage({ type: 'wishingskin:host', id, action, payload }, '*');
    });
  }

  function setDirty(next) {
    const val = !!next;
    if (dirty === val) return;
    dirty = val;
    callHost('setDirty', { dirty: val }).catch(() => {});
  }

  function setSourceSkin(skin) {
    baseSkin = skin;
    document.getElementById('base-model').value = skin.model === 'slim' ? 'slim' : 'default';
    document.getElementById('save-name').value = (skin.name || '皮肤') + '（转换）';
    document.getElementById('source-pill').hidden = false;
    document.getElementById('source-name').textContent = skin.name || '已选择皮肤';
    document.getElementById('source-meta').textContent = skin.model === 'slim' ? 'Alex (3px)' : 'Steve (4px)';
    if (skin.dataUrl) {
      document.getElementById('source-thumb').src = skin.dataUrl;
      document.getElementById('source-thumb').hidden = false;
    } else {
      document.getElementById('source-thumb').hidden = true;
    }
    void runTransform(false);
  }

  function hasNonZeroTransforms() {
    return document.getElementById('arm-convert').value !== '' ||
      document.getElementById('opt-strip-outer').checked ||
      document.getElementById('opt-grayscale').checked ||
      Number(document.getElementById('sl-hue').value) !== 0 ||
      Number(document.getElementById('sl-sat').value) !== 0 ||
      Number(document.getElementById('sl-bright').value) !== 0;
  }

  function scheduleTransform() {
    document.getElementById('val-hue').innerHTML = document.getElementById('sl-hue').value + '&deg;';
    document.getElementById('val-sat').textContent = document.getElementById('sl-sat').value + '%';
    document.getElementById('val-bright').textContent = document.getElementById('sl-bright').value + '%';
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => void runTransform(true), 140);
  }

  async function runTransform(markChanged) {
    if (!baseSkin) return;
    const msg = document.getElementById('tool-msg');
    msg.textContent = '';

    try {
      const res = await callPlugin('POST', '/transform', {
        fileHash: baseSkin.fileHash || '',
        pngBase64: baseSkin.pngBase64 || '',
        model: document.getElementById('base-model').value,
        upgradeLegacy: document.getElementById('opt-upgrade').checked,
        armConvert: document.getElementById('arm-convert').value,
        hueShift: Number(document.getElementById('sl-hue').value) || 0,
        saturation: Number(document.getElementById('sl-sat').value) || 0,
        brightness: Number(document.getElementById('sl-bright').value) || 0,
        grayscale: document.getElementById('opt-grayscale').checked,
        stripOuter: document.getElementById('opt-strip-outer').checked,
        cleanAlpha: document.getElementById('opt-clean-alpha').checked
      });
      if (res.status !== 200) {
        msg.className = 'msg err';
        msg.textContent = (res.body && res.body.error) || '处理失败';
        return;
      }
      lastResult = res.body;
      document.getElementById('preview-area').hidden = false;
      document.getElementById('preview-empty').hidden = true;
      document.getElementById('save-btn').disabled = false;
      document.getElementById('prev-front').src = 'data:image/png;base64,' + lastResult.frontPreviewBase64;
      document.getElementById('prev-back').src = 'data:image/png;base64,' + lastResult.backPreviewBase64;
      document.getElementById('out-meta').textContent = '输出分辨率 ' + lastResult.width + '×' + lastResult.height + '  手臂模型：' + (lastResult.model === 'slim' ? 'Alex 3px' : 'Steve 4px');

      const dl = document.getElementById('dl-link');
      dl.href = 'data:image/png;base64,' + lastResult.pngBase64;
      dl.hidden = false;

      callHost('setPreview', {
        pngBase64: lastResult.pngBase64,
        model: lastResult.model === 'slim' ? 'slim' : 'default',
        title: '格式转换 3D 预览'
      }).catch(() => {});

      if (markChanged || hasNonZeroTransforms()) setDirty(true);
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = err.message || '处理异常';
    }
    requestAnimationFrame(postResize);
  }

  document.getElementById('pick-site-btn').addEventListener('click', async () => {
    try {
      const picked = await callHost('pickTexture', { kind: 'skin' });
      if (!picked || picked.cancelled) return;
      setSourceSkin({
        fileHash: picked.fileHash,
        name: picked.name || '站点皮肤',
        model: picked.model === 'slim' ? 'slim' : 'default',
        dataUrl: picked.dataUrl
      });
    } catch (err) {
      if (err && err.status === 499) return;
      const msg = document.getElementById('tool-msg');
      msg.className = 'msg err';
      msg.textContent = (err && err.message) || '打开选择器失败';
    }
  });

  document.getElementById('local-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      setSourceSkin({
        pngBase64: reader.result,
        name: file.name.replace(/\.png$/i, ''),
        model: document.getElementById('base-model').value,
        dataUrl: reader.result
      });
    };
    reader.readAsDataURL(file);
  });

  for (const id of ['base-model', 'arm-convert', 'opt-upgrade', 'opt-clean-alpha', 'opt-strip-outer', 'opt-grayscale', 'sl-hue', 'sl-sat', 'sl-bright']) {
    document.getElementById(id).addEventListener('input', scheduleTransform);
    document.getElementById(id).addEventListener('change', scheduleTransform);
  }

  document.getElementById('reset-btn').addEventListener('click', () => {
    document.getElementById('arm-convert').value = '';
    document.getElementById('opt-upgrade').checked = true;
    document.getElementById('opt-clean-alpha').checked = true;
    document.getElementById('opt-strip-outer').checked = false;
    document.getElementById('opt-grayscale').checked = false;
    document.getElementById('sl-hue').value = '0';
    document.getElementById('sl-sat').value = '0';
    document.getElementById('sl-bright').value = '0';
    setDirty(false);
    scheduleTransform();
  });

  document.getElementById('save-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!lastResult || !lastResult.pngBase64) return;
    const btn = document.getElementById('save-btn');
    const msg = document.getElementById('save-msg');
    btn.disabled = true; btn.textContent = '保存中…';
    msg.className = 'msg'; msg.textContent = '';

    try {
      const saved = await callHost('saveTexture', {
        kind: 'skin',
        name: document.getElementById('save-name').value.trim(),
        model: lastResult.model === 'slim' ? 'slim' : 'default',
        pngBase64: lastResult.pngBase64
      });
      const recId = saved && (saved.id || (saved.record && saved.record.id));
      const charId = Number(document.getElementById('save-char').value) || 0;
      const pending = !!(saved && (saved.pendingReview || (saved.record && saved.record.reviewState === 'pending')));
      if (charId > 0 && recId && !pending) {
        await callHost('applyTexture', {
          characterId: charId,
          kind: 'skin',
          recordId: recId,
          model: lastResult.model === 'slim' ? 'slim' : 'default'
        });
        msg.textContent = '已保存并穿戴到所选角色！';
      } else if (pending) {
        msg.textContent = '已上传保存，等待管理员审核通过后生效。';
      } else {
        msg.textContent = '已保存到我的材质库！';
      }
      msg.className = 'msg ok';
      setDirty(false);
      callHost('notify', { message: msg.textContent, kind: 'success' }).catch(() => {});
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = (err && err.message) || '保存失败';
    } finally {
      btn.disabled = false; btn.textContent = '保存为新材质';
    }
  });

  async function init() {
    const charData = await callHost('listCharacters').catch(() => ({ characters: [] }));
    const sel = document.getElementById('save-char');
    sel.innerHTML = '<option value="0">仅保存到我的材质库</option>';
    for (const c of (charData && charData.characters) || []) {
      const opt = document.createElement('option');
      opt.value = String(c.id);
      opt.textContent = c.name + (c.model === 'slim' ? '（纤细）' : '（经典）');
      sel.appendChild(opt);
    }
  }
  void init();
})();
</script>
</body>
</html>
